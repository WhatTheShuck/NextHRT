overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # Security: patched versions of transitive deps (Prisma CLI)
  mysql2: ^3.23.1

allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  core-js: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - vite@8.3.2
